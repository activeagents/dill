test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Local disk for development
local:
  service: Disk
  root: <%= Rails.root.join("storage", "files") %>
  public: true

# Google Cloud Storage for staging/production
# GCS_BUCKET is set via Secret Manager in Cloud Run
# Uses Application Default Credentials (Cloud Run service account)
google:
  service: GCS
  project: <%= ENV["GCP_PROJECT_ID"] || "dill-488620" %>
  bucket: <%= ENV["GCS_BUCKET"] %>
