name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

env:
  TF_VERSION: '1.7.0'
  GCP_PROJECT_ID: dill-488620
  GCP_REGION: us-central1
  WORKLOAD_IDENTITY_PROVIDER: projects/969854275436/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-actions@dill-488620.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="rails_master_key=${{ secrets.RAILS_MASTER_KEY }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="oauth_support_email=${{ secrets.OAUTH_SUPPORT_EMAIL }}" \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}" \
            -var="porkbun_api_key=${{ secrets.PORKBUN_API_KEY }}" \
            -var="porkbun_secret_key=${{ secrets.PORKBUN_SECRET_KEY }}" \
            -var="domain=dill.vc" \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... (truncated)'
              : planOutput;

            const body = `## Terraform Plan

            <details>
            <summary>Click to expand plan output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Plan generated for commit ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="rails_master_key=${{ secrets.RAILS_MASTER_KEY }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="oauth_support_email=${{ secrets.OAUTH_SUPPORT_EMAIL }}" \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}" \
            -var="porkbun_api_key=${{ secrets.PORKBUN_API_KEY }}" \
            -var="porkbun_secret_key=${{ secrets.PORKBUN_SECRET_KEY }}" \
            -var="domain=dill.vc"

    outputs:
      applied: ${{ steps.apply.outcome == 'success' }}
