name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '**.md'
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '**.md'
  # Re-run deploy after infrastructure changes are applied
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches: [main]

env:
  GCP_PROJECT_ID: dill-488620
  GCP_REGION: us-central1
  SERVICE_NAME: dill
  ARTIFACT_REGISTRY: dill-488620/dill
  WORKLOAD_IDENTITY_PROVIDER: projects/969854275436/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-actions@dill-488620.iam.gserviceaccount.com
  # Cloud SQL instance connection name (project:region:instance)
  CLOUD_SQL_CONNECTION: dill-488620:us-central1:dill-db

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Deploy to staging on PR
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.ARTIFACT_REGISTRY }}/app:staging-${{ github.sha }}"
          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}
          echo "IMAGE_URI=${IMAGE_URI}" >> ${GITHUB_ENV}

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        run: |
          URL=$(gcloud run deploy ${{ env.SERVICE_NAME }}-staging \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_CONNECTION }} \
            --set-env-vars RAILS_ENV=staging,RAILS_LOG_TO_STDOUT=true,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            --set-secrets RAILS_MASTER_KEY=dill-rails-master-key:latest,DATABASE_URL=dill-database-url:latest,GCS_BUCKET=dill-gcs-bucket:latest,GEMINI_API_KEY=dill-gemini-api-key:latest \
            --format "value(uri)") || {
              echo "::warning::Deploy failed - infrastructure may not be provisioned yet. Run terraform apply first."
              exit 1
            }
          echo "url=${URL}" >> ${GITHUB_OUTPUT}

      - name: Comment PR with Staging URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deployed: ${{ steps.deploy.outputs.url }}`
            })

  # Deploy to production on main push or after terraform apply
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Run on push to main, or after successful terraform apply
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: production
      url: https://dill.vc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, checkout the head branch
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.ARTIFACT_REGISTRY }}/app:prod-${{ github.event.workflow_run.head_sha || github.sha }}"
          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}
          echo "IMAGE_URI=${IMAGE_URI}" >> ${GITHUB_ENV}

      - name: Deploy to Cloud Run (Production)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_CONNECTION }} \
            --set-env-vars RAILS_ENV=production,RAILS_LOG_TO_STDOUT=true,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            --set-secrets RAILS_MASTER_KEY=dill-rails-master-key:latest,DATABASE_URL=dill-database-url:latest,GCS_BUCKET=dill-gcs-bucket:latest,GEMINI_API_KEY=dill-gemini-api-key:latest

      - name: Run Database Migrations
        run: |
          # Run migrations via Cloud Run Jobs (if exists) or direct exec
          gcloud run jobs execute ${{ env.SERVICE_NAME }}-migrate \
            --region ${{ env.GCP_REGION }} \
            --wait \
            2>/dev/null || echo "::notice::Migration job not found - create with: gcloud run jobs create"
