name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]

env:
  GCP_PROJECT_ID: dill-488620
  GCP_REGION: us-central1
  SERVICE_NAME: dill
  ARTIFACT_REGISTRY: dill-488620/dill
  WORKLOAD_IDENTITY_PROVIDER: projects/969854275436/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-actions@dill-488620.iam.gserviceaccount.com
  # Cloud SQL instance connection name (project:region:instance)
  CLOUD_SQL_CONNECTION: dill-488620:us-central1:dill-db

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Deploy to staging on PR
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.ARTIFACT_REGISTRY }}/app:staging-${{ github.sha }}"
          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}
          echo "IMAGE_URI=${IMAGE_URI}" >> ${GITHUB_ENV}

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        run: |
          URL=$(gcloud run deploy ${{ env.SERVICE_NAME }}-staging \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_CONNECTION }} \
            --set-env-vars RAILS_ENV=staging,RAILS_LOG_TO_STDOUT=true,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            --set-secrets RAILS_MASTER_KEY=dill-rails-master-key:latest,DATABASE_URL=dill-database-url:latest,GCS_BUCKET=dill-gcs-bucket:latest,GEMINI_API_KEY=dill-gemini-api-key:latest \
            --format "value(uri)")
          echo "url=${URL}" >> ${GITHUB_OUTPUT}

      - name: Comment PR with Staging URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deployed: ${{ steps.deploy.outputs.url }}`
            })

  # Deploy to production on main push
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://dill.vc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.ARTIFACT_REGISTRY }}/app:prod-${{ github.sha }}"
          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}
          echo "IMAGE_URI=${IMAGE_URI}" >> ${GITHUB_ENV}

      - name: Deploy to Cloud Run (Production)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_CONNECTION }} \
            --set-env-vars RAILS_ENV=production,RAILS_LOG_TO_STDOUT=true,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            --set-secrets RAILS_MASTER_KEY=dill-rails-master-key:latest,DATABASE_URL=dill-database-url:latest,GCS_BUCKET=dill-gcs-bucket:latest,GEMINI_API_KEY=dill-gemini-api-key:latest

      - name: Run Database Migrations
        run: |
          gcloud run jobs execute ${{ env.SERVICE_NAME }}-migrate \
            --region ${{ env.GCP_REGION }} \
            --wait \
            || echo "Migration job not found - skipping (run terraform apply to create)"
